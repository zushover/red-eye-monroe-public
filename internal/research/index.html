<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>天气观察室</title>
<style>
:root{color-scheme:dark;font-family:system-ui;color:#e8eff8;background:#0b1421}body{margin:0}main{max-width:1120px;margin:auto;padding:28px}h1{font-size:30px;margin-bottom:8px}p,small{color:#a9bacd;line-height:1.7}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}select,button{background:#192a40;border:1px solid #385271;border-radius:8px;color:#fff;padding:10px}.card{padding:22px;background:#122136;border:1px solid #263c57;border-radius:16px;margin:18px 0}.stats{display:flex;gap:28px;flex-wrap:wrap}.stats strong{display:block;font-size:24px}.stats span{font-size:13px;color:#a9bacd}svg{width:100%;height:auto}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #294059}a{color:#8bc4ff}.warn{color:#ffd488}.legend{display:flex;gap:20px}#error{color:#ffd488}@media(max-width:650px){main{padding:14px}.card{padding:14px}table{font-size:12px}}
</style><main><h1>天气观察室</h1><p>当地今天与明天 · 同站实况 · 两个数值模式 · 每 10 分钟采集</p><div class="toolbar"><select id="site" aria-label="观测站"></select><select id="day" aria-label="目标日期"><option value="0">当地今天</option><option value="1">当地明天</option></select><button id="refresh">刷新展示</button></div><p id="error">首次数据采集中…</p><div id="root"></div><section class="card"><h2>数据与可信度</h2><p>METAR 是站点航空观测，曲线上的最大值仅是已采集样本最大值。ECMWF / GFS 是经 Open-Meteo 提供的网格预报，与机场温度计的观测位置及海拔可能不同。</p><p class="warn">两条预报之间的差值不是置信区间。此版本未训练概率校准器，因此不显示未经验证的百分比，也不使用旧模型的人工误差宽度。接收时间不等于预报批次发布时间。</p><p><a href="https://aviationweather.gov/data/api/">NOAA AWC 实况</a> · <a href="https://open-meteo.com/en/docs">预报接口与模型</a> · <a href="https://open-meteo.com/en/docs/single-runs-api">历史预报原始批次</a> · <a href="https://www.ncei.noaa.gov/products/land-based-station/integrated-surface-database">NOAA 历史站点数据</a></p></section></main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=n=>Number.isFinite(n)?n.toFixed(1)+' °C':'—';let data,history=[];
const peak=p=>p?.length?Math.max(...p.map(x=>x.c)):null;
function chart(series,zone){let pts=series.flatMap(s=>s.points);if(!pts.length)return '<p>暂无可绘制数据</p>';let minT=Math.min(...pts.map(p=>Date.parse(p.at))),maxT=Math.max(...pts.map(p=>Date.parse(p.at))),minC=Math.floor(Math.min(...pts.map(p=>p.c))-1),maxC=Math.ceil(Math.max(...pts.map(p=>p.c))+1);const x=t=>54+((Date.parse(t)-minT)/Math.max(1,maxT-minT))*890,y=c=>250-(c-minC)/Math.max(1,maxC-minC)*210;let parts=[];for(let i=0;i<=4;i++){let c=minC+(maxC-minC)*i/4;parts.push(`<line x1="54" y1="${y(c)}" x2="944" y2="${y(c)}" stroke="#294059"/><text x="0" y="${y(c)+4}" fill="#a9bacd" font-size="12">${c.toFixed(1)}°</text>`)}for(let i=0;i<=4;i++){let t=new Date(minT+(maxT-minT)*i/4);parts.push(`<text x="${54+890*i/4}" y="282" text-anchor="middle" fill="#a9bacd" font-size="12">${esc(t.toLocaleTimeString('zh-CN',{timeZone:zone,hour:'2-digit',minute:'2-digit'}))}</text>`)}for(let s of series){parts.push(`<polyline fill="none" stroke="${s.color}" stroke-width="2.5" points="${s.points.map(p=>x(p.at)+','+y(p.c)).join(' ')}"/>`);for(let p of s.points)parts.push(`<circle cx="${x(p.at)}" cy="${y(p.c)}" r="2" fill="${s.color}"><title>${esc(s.name)} ${esc(p.at)} ${p.c} °C</title></circle>`)}return `<svg viewBox="0 0 980 300" role="img" aria-label="逐小时温度曲线">${parts.join('')}</svg>`}
function render(){if(!data)return;let site=data.sites.find(s=>s.icao===$('#site').value)||data.sites[0],day=site.days[+$('#day').value];let age=(Date.now()-Date.parse(data.at))/60000;$('#error').textContent=`采集完成：${new Date(data.at).toLocaleString()}${age>20?' · 数据已过期':''}`;let series=day.runs.map((r,i)=>({name:r.model,color:i?'#b99cff':'#65c9ff',points:r.points}));series.push({name:'METAR',color:'#59e0b0',points:day.observed});let prior=history.slice(0,-1).reverse().map(h=>h.sites.find(s=>s.icao===site.icao)?.days.find(d=>d.date===day.date)).find(Boolean);$('#root').innerHTML=`<section class="card"><h2>${esc(site.name)} · ${esc(site.icao)}</h2><p>${esc(day.date)} · ${esc(site.zone)} · 所有温度单位 °C</p>${site.error?'<p class="warn">'+esc(site.error)+'</p>':''}<div class="stats"><div><strong>${fmt(peak(day.observed))}</strong><span>已采集实测最高，${day.observed.length} 个样本</span></div>${day.runs.map(r=>`<div><strong>${fmt(peak(r.points))}</strong><span>${esc(r.model)} 逐小时预报峰值</span></div>`).join('')}</div>${chart(series,site.zone)}<div class="legend"><span style="color:#65c9ff">ECMWF IFS 0.25°</span><span style="color:#b99cff">GFS seamless</span><span style="color:#59e0b0">METAR</span></div></section><section class="card"><h2>预报更新记录</h2><table><tr><th>模式</th><th>有效小时数</th><th>接收时间</th><th>较上次峰值变化</th></tr>${day.runs.map(r=>{let old=prior?.runs.find(x=>x.model===r.model),a=peak(r.points),b=peak(old?.points);return `<tr><td>${esc(r.model)}${r.error?'<br>'+esc(r.error):''}</td><td>${r.points.length}</td><td>${r.received.startsWith('0001')?'未取得':esc(new Date(r.received).toLocaleString())}</td><td>${a!=null&&b!=null?fmt(a-b):'尚无前一轮记录'}</td></tr>`}).join('')}</table><p>更新历史仅展示本次进程内记录；原始输入持续保存到本地归档。缺测显示为空，不填成 0 °C。</p></section>`}
async function load(){try{let r=await fetch('/api/weather',{cache:'no-store'});if(!r.ok)throw Error('正在采集或数据暂不可用');data=await r.json();history=await(await fetch('/api/history')).json();let selected=$('#site').value;$('#site').innerHTML=data.sites.map(s=>`<option value="${esc(s.icao)}">${esc(s.name)} (${esc(s.icao)})</option>`).join('');if(data.sites.some(s=>s.icao===selected))$('#site').value=selected;render()}catch(e){$('#error').textContent=e.message}}
const originalRender=render;
render=function(){originalRender();if(!data)return;let panel=$('#watchlist');if(!panel){panel=document.createElement('section');panel.id='watchlist';panel.className='card';$('#root').before(panel)}const rank={'变化明显':0,'数据不足':1,'继续观察':2,'趋于稳定':3};const rows=data.sites.map(s=>({site:s,day:s.days[+$('#day').value]})).sort((a,b)=>(rank[a.day.quality.state]??4)-(rank[b.day.quality.state]??4));panel.innerHTML=`<h2>站点关注列表 · ${rows.length} 站</h2><p>排序反映天气预报的变化与数据质量。趋于稳定的站点仍持续采集。点击站名查看曲线。</p><div style="overflow:auto"><table><thead><tr><th>站点／当地日期</th><th>状态</th><th>模式峰值差</th><th>较上一轮变化</th><th>实况年龄</th></tr></thead><tbody>${rows.map(({site:s,day:d})=>{const q=d.quality;return `<tr><td><button data-site="${esc(s.icao)}">${esc(s.name)}</button><br><small>${esc(d.date)} · ${esc(s.zone)}</small></td><td>${esc(q.state)}<br><small>${q.reasons.map(esc).join('；')}</small></td><td>${fmt(q.spread_c)}</td><td>${fmt(q.revision_c)}</td><td>${Number.isFinite(q.observation_age_minutes)?Math.round(q.observation_age_minutes)+' 分钟':'目标日无实况'}<br><small>预报期望 ${q.expected_hours} 小时</small></td></tr>`}).join('')}</tbody></table></div><p>变化阈值仅用于研究导航，尚未用历史样本验证。数据不足不会被标记为稳定。</p>`;panel.querySelectorAll('[data-site]').forEach(b=>b.onclick=()=>{$('#site').value=b.dataset.site;render();$('#root').scrollIntoView({behavior:'smooth'})})};
$('#site').onchange=render;$('#day').onchange=render;$('#refresh').onclick=load;load();setInterval(load,30000);
</script></html>
